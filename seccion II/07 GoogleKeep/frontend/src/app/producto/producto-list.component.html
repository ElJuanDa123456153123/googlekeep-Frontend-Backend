<div class="card">
    <h1>Productos</h1>

    <div class="card flex justify-center mb-4">
        <button pButton (click)="createProducto()">
            <i class="pi pi-plus" pButtonIcon></i>
            <span pButtonLabel>Nuevo</span>
        </button>
    </div>

    <p-table [value]="dataProductos()" [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template #header>
            <tr>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Actualizado</th>
                <th>Acciones</th>
            </tr>
        </ng-template>
        <ng-template #body let-item>
            <tr>
                <td>{{ item.nombre }}</td>
                <td>{{ item.descripcion }}</td>
                <td>{{ item.precio }}</td>
                <td>{{ item.stock }}</td>
                <td>{{ item.updated_at | date:'medium' }}</td>
                <td>
                    <button pButton type="button" (click)="updateProducto(item)" icon="pi pi-pencil" class="p-button-rounded p-button-text"></button>
                    <button pButton type="button" (click)="deleteProducto(item)" icon="pi pi-trash" severity="danger" class="p-button-rounded p-button-text"></button>
                </td>
            </tr>
        </ng-template>
    </p-table>

    <p-confirmDialog />
    <app-producto (messageEvent)="loadProductos()"></app-producto>
</div>
